; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
; Excluye los mains de prueba RTOS (ver env:rtos_sensor_test y
; env:rtos_scheduler_test) para que no choquen con este main.cpp (todos
; definen setup()/loop()).
build_src_filter =
  +<*>
  -<test_RTOS/main_rtos_sensors.cpp>
  -<test_RTOS/rtos_scheduler_test.cpp>
  -<test_sensors/bno_servo_standalone.cpp>
  -<test_sensors/ir_test.cpp>
  -<test_RTOS/rtos_ir_test.cpp>
  -<test_sensors/i2c_scanner.cpp>
  -<test_RTOS/rtos_bno_only.cpp>
  -<test_sensors/blink_test.cpp>
  -<test_RTOS/rtos_statemachine_test.cpp>
  -<test_sensors/servo_test.cpp>
  -<test_sensors/tca_scanner.cpp>
  -<test_sensors/i2c_combined_scanner.cpp>

build_flags =
  -I include
  -I lib/Sensors/qtr
  -I lib/Sensors/mux
  -I lib/Sensors/IR_mux
  -I lib/Sensors/tof
  -I lib/Sensors/IR
  -I lib/Sensors/BNO

platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = time

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit BNO055           ; ← BNO055
  adafruit/Adafruit BNO08x           ; ← BNO085
  adafruit/Adafruit TCS34725
  pololu/VL53L0X
  pololu/VL53L1X
  adafruit/Adafruit Unified Sensor
  br3ttb/PID@^1.2.1
  ;PCA para los servos
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  ;VL53L0X
  adafruit/Adafruit PWM Servo Driver Library
  adafruit/Adafruit VL53L1X@^3.1.2

; -----------------------------------------------------------------
; Entorno separado para probar RTOS real (FreeRTOS) + sensores antes
; de integrar con LARCStateMachine. Comparte src/ con el firmware real
; pero build_src_filter limita la compilación a un único punto de
; entrada (src/main_rtos_sensors.cpp) para no chocar con main.cpp.
;
; pio run -e rtos_sensor_test -t upload
; -----------------------------------------------------------------
[env:rtos_sensor_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/main_rtos_sensors.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; FreeRTOS-Teensy4 vendorizado en lib/FreeRTOS-Teensy4 (no se usa la
  ; version del registro): el port original calcula mal el reload del
  ; SysTick para el core actual de Teensyduino y cuelga vTaskStartScheduler().
  ; Ver el fix en lib/FreeRTOS-Teensy4/src/port.c (vPortSetupTimerInterrupt).

; -----------------------------------------------------------------
; Test minimo para aislar si vTaskStartScheduler() funciona en este
; hardware sin tocar I2C/sensores (ver src/rtos_scheduler_test.cpp).
;
; pio run -e rtos_scheduler_test -t upload -t monitor
; -----------------------------------------------------------------
[env:rtos_scheduler_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/rtos_scheduler_test.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; Ver nota en env:rtos_sensor_test: usa el FreeRTOS-Teensy4 vendorizado
  ; en lib/FreeRTOS-Teensy4 (con el fix de SysTick), no el del registro.

; -----------------------------------------------------------------
; Prueba standalone (SIN RTOS) de BNO055 + servo via PCA9685, identica al
; sketch que el equipo confirmo que funcionaba antes. Sirve de control A/B
; contra env:rtos_sensor_test: mismo cableado, mismo I2C, sin FreeRTOS.
;
; pio run -e bno_servo_standalone -t upload -t monitor
; -----------------------------------------------------------------
[env:bno_servo_standalone]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/bno_servo_standalone.cpp>

; -----------------------------------------------------------------
; Diagnostico de los 4 IR digitales (FL/FR/BL/BR, ver pins.h) leidos
; directo por digitalRead(), sin pasar por ningun mux ni el resto del
; firmware. Util para ver si estan conectados: pasa la mano sobre cada uno
; y observa si su valor cambia de forma estable o si "parpadea" solo
; (pin flotante).
;
; pio run -e ir_test -t upload -t monitor
; -----------------------------------------------------------------
[env:ir_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/ir_test.cpp>

; -----------------------------------------------------------------
; Combina el RTOS (ya arreglado, ver lib/FreeRTOS-Teensy4) con la lectura
; de los 4 IR digitales (ver ir_test.cpp) en una sola tarea. Los IR son
; digitalRead() directo, sin I2C/mutex/mux, asi que no hay riesgo de
; colgar el scheduler como pasaba con el BNO055.
;
; pio run -e rtos_ir_test -t upload -t monitor
; -----------------------------------------------------------------
[env:rtos_ir_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/rtos_ir_test.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; Ver nota en env:rtos_sensor_test: usa el FreeRTOS-Teensy4 vendorizado
  ; en lib/FreeRTOS-Teensy4 (con el fix del MSP), no el del registro.

; -----------------------------------------------------------------
; Escaneo crudo del bus I2C (sin RTOS, sin asumir ningun dispositivo):
; recorre las 127 direcciones y reporta cuales responden. Correr esto
; primero para confirmar en vivo si el BNO055 (0x28/0x29) o el TCA9548A
; (0x70-0x77) estan realmente vivos en el cableado actual, antes de
; asumir que un driver especifico esta mal (ver src/i2c_scanner.cpp).
;
; pio run -e i2c_scanner -t upload -t monitor
; -----------------------------------------------------------------
[env:i2c_scanner]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/i2c_scanner.cpp>

; -----------------------------------------------------------------
; RTOS (ya arreglado, ver lib/FreeRTOS-Teensy4) leyendo UNICAMENTE el
; BNO055 -- sin ToF, sin mux TCA9548A, sin IR -- para aislar si el
; sensor responde corriendo dentro del scheduler, una vez confirmada su
; direccion con env:i2c_scanner (ver src/rtos_bno_only.cpp).
;
; pio run -e rtos_bno_only -t upload -t monitor
; -----------------------------------------------------------------
[env:rtos_bno_only]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/rtos_bno_only.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; Ver nota en env:rtos_sensor_test: usa el FreeRTOS-Teensy4 vendorizado
  ; en lib/FreeRTOS-Teensy4 (con el fix del MSP), no el del registro.

; -----------------------------------------------------------------
; Prueba minima sin I2C/Serial/sensores: solo parpadea el LED integrado
; (pin 13). Sirve para descartar problemas de alimentacion, upload USB o
; enumeracion de puerto serial antes de sospechar del bus I2C.
;
; pio run -e blink_test -t upload
; -----------------------------------------------------------------
[env:blink_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/blink_test.cpp>

; -----------------------------------------------------------------
; Mueve en loop (barrido 0-180-0) el unico servo que, segun el equipo,
; esta conectado por el momento: directo al pin 8 del Teensy (Servo
; library, sin PCA9685). OJO: en include/pins.h el pin 8 esta asignado
; a kPwmPin[0] (PWM_M1, motor de chasis) -- confirmar con el equipo si
; es cableado temporal para esta prueba o si cambio el mapeo real
; (ver src/servo_test.cpp).
;
; pio run -e servo_test -t upload -t monitor
; -----------------------------------------------------------------
[env:servo_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/servo_test.cpp>

; -----------------------------------------------------------------
; Escaneo canal por canal del TCA9548A (confirmado vivo en 0x70 por
; env:i2c_scanner): selecciona cada uno de los 8 canales y escanea el
; bus I2C detras, para confirmar cuales ToF estan realmente conectados
; en los canales FR/FL/BL/BR (ver pins.h y src/tca_scanner.cpp).
;
; pio run -e tca_scanner -t upload -t monitor
; -----------------------------------------------------------------
[env:tca_scanner]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/tca_scanner.cpp>

; -----------------------------------------------------------------
; Version combinada y continua: en cada ronda hace ping directo al
; BNO055 (bus principal) Y escanea los 8 canales del TCA9548A buscando
; los ToF, todo en el mismo loop -- para ver el estado de ambos al
; mismo tiempo. Incluye recuperacion de bus I2C (bit-bang de SCL) si el
; mux deja de responder a mitad de ronda (ver src/i2c_combined_scanner.cpp).
;
; pio run -e i2c_combined_scanner -t upload -t monitor
; -----------------------------------------------------------------
[env:i2c_combined_scanner]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/i2c_combined_scanner.cpp>

; pio run -e rtos_statemachine_test -t upload -t monitor
[env:rtos_statemachine_test]
extends = env:teensy41
build_src_filter =
  +<*>
  -<main.cpp>
  -<test_RTOS/main_rtos_sensors.cpp>
  -<test_RTOS/rtos_scheduler_test.cpp>
  -<test_sensors/bno_servo_standalone.cpp>
  -<test_sensors/ir_test.cpp>
  -<test_RTOS/rtos_ir_test.cpp>
  -<test_sensors/i2c_scanner.cpp>
  -<test_RTOS/rtos_bno_only.cpp>
  -<test_sensors/blink_test.cpp>
  -<test_sensors/servo_test.cpp>
  -<test_sensors/tca_scanner.cpp>
  -<test_sensors/i2c_combined_scanner.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; Ver nota en env:rtos_sensor_test: usa el FreeRTOS-Teensy4 vendorizado
  ; en lib/FreeRTOS-Teensy4 (con el fix del MSP), no el del registro.