; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
; Excluye el main de prueba RTOS (ver env:rtos_sensor_test) para que no
; choque con este main.cpp (ambos definen setup()/loop()).
build_src_filter =
  +<*>
  -<main_rtos_sensors.cpp>

build_flags =
  -I include
  -I lib/Sensors/qtr
  -I lib/Sensors/mux
  -I lib/Sensors/IR_mux
  -I lib/Sensors/tof
  -I lib/Sensors/IR
  -I lib/Sensors/BNO

platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = time

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit BNO055           ; ← BNO055
  adafruit/Adafruit BNO08x           ; ← BNO085
  adafruit/Adafruit TCS34725
  pololu/VL53L0X
  pololu/VL53L1X
  adafruit/Adafruit Unified Sensor
  br3ttb/PID@^1.2.1
  ;PCA para los servos
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  ;VL53L0X
  adafruit/Adafruit PWM Servo Driver Library
  adafruit/Adafruit VL53L1X@^3.1.2

; -----------------------------------------------------------------
; Entorno separado para probar RTOS real (FreeRTOS) + sensores antes
; de integrar con LARCStateMachine. Comparte src/ con el firmware real
; pero build_src_filter limita la compilación a un único punto de
; entrada (src/main_rtos_sensors.cpp) para no chocar con main.cpp.
;
; pio run -e rtos_sensor_test -t upload
; -----------------------------------------------------------------
[env:rtos_sensor_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<main_rtos_sensors.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; Port real de FreeRTOS para Teensy 4.x (Cortex-M7), confirmado en el
  ; registro de PlatformIO via `pio pkg search "teensy freertos"`.
  discord-intech/FreeRTOS-Teensy4