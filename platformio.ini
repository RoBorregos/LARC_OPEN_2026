; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
build_src_filter =

  +<*>
  -<test_RTOS/main_rtos_sensors.cpp>
  -<test_RTOS/rtos_scheduler_test.cpp>
  -<test_sensors/bno_servo_standalone.cpp>
  -<test_sensors/bno085_standalone.cpp>
  -<test_sensors/ir_test.cpp>
  -<test_RTOS/rtos_ir_test.cpp>
  -<test_sensors/i2c_scanner.cpp>
  -<test_RTOS/rtos_bno_only.cpp>
  -<test_RTOS/rtos_bno085_only.cpp>
  -<test_sensors/blink_test.cpp>
  -<test_RTOS/rtos_statemachine_test.cpp>
  -<test_sensors/servo_test.cpp>
  -<test_sensors/tca_scanner.cpp>
  -<test_sensors/i2c_combined_scanner.cpp>
  -<test_sensors/motor_test.cpp>
  -<test_sensors/motor_test_m1_m3.cpp>
  -<test_sensors/sensors_motors_test.cpp>
  -<test_sensors/testDrive.cpp>
  -<test_sensors/testDriveFORWARD.cpp>
  -<test_sensors/testMotors.cpp>
  -<test_sensors/motor_direct_pins_test.cpp>
  -<test_sensors/testKinematics.cpp>
  -<test_sensors/qtr_test.cpp>
  -<test_sensors/vlx_qtr_test.cpp>
  -<test_sensors/vlx_single_test.cpp>
  -<test_sensors/vlx_drive_test.cpp>
  -<test_sensors/calibrate_qtr.cpp>
  -<test_sensors/byMotor/>
  -<test_sensors/allMotorsGetRevolution.cpp>
  -<test_sensors/qtr_corner_drive_test.cpp>
  ; The old main.cpp (BNO055 + PCA9685 probe) lives here now; it has its
  ; own setup()/loop(). Build it with: pio run -e bno055_pca_probe -t upload
  -<test_sensors/bno055_pca_probe.cpp>
  ; Bench test for the state machine + VisionLink; it has its own setup()/
  ; loop(), so it must not land in the same binary as main.cpp.
  -<test_sensors/drive_statemachine_test.cpp>
  ; AntiqueStateMachine is kept in the repo as a reference 
  -<robot/StateMachine/AntiqueStateMachine/StateMachine.cpp>

build_flags =
  ; -D SM_DEBUG=1   ; telemetry over USB. OFF by default: the Orin vision link
  ;                   shares this port, so prints land in its frame parser.
  -I include
  -I lib/Sensors/qtr
  -I lib/Sensors/mux
  -I lib/Sensors/IR_mux
  -I lib/Sensors/tof
  -I lib/Sensors/IR
  -I lib/Sensors/BNO
  -I lib/sensors
  -I lib/PCA9685
  -I lib/Servos
  -I lib/Vision

platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = time

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit BNO055 ; ← BNO055
  adafruit/Adafruit BNO08x ; ← BNO085
  adafruit/Adafruit TCS34725
  pololu/VL53L0X
  pololu/VL53L1X
  adafruit/Adafruit Unified Sensor
  br3ttb/PID@^1.2.1
  ; Adafruit PCA lib: only used by test_sensors/bno055_pca_probe.cpp now.
  ; The servos run on our own lib/PCA9685.
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  adafruit/Adafruit VL53L1X@^3.1.2


[env:drive_statemachine_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/drive_statemachine_test.cpp>
  +<robot/>
  +<subsystem/>
  -<robot/StateMachine/AntiqueStateMachine/>
build_flags =
  ${env:teensy41.build_flags}
  -D DRIVE_TEST_START_STATE=LOOKFORLINE

;   pio run -e benefits_line_test -t upload
[env:benefits_line_test]
extends = env:drive_statemachine_test
build_flags =
  ${env:teensy41.build_flags}
  -D DRIVE_TEST_START_STATE=BENEFITS


[env:qtr_calibrate]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/calibrate_qtr.cpp>
  +<robot/>
  +<subsystem/>
  -<robot/StateMachine/AntiqueStateMachine/>
;   pio run -e bno055_pca_probe -t upload -t monitor
[env:bno055_pca_probe]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/bno055_pca_probe.cpp>

[env:sm_line_test]
extends = env:sm_vision_test
build_flags =
  ${env:teensy41.build_flags}
  -D SM_TEST_START_STATE=LOOKFORLINE
  -D SM_DEBUG=1
