; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
; Excludes the RTOS test mains (see env:rtos_sensor_test and
; env:rtos_scheduler_test) so they don't clash with this main.cpp (they
; all define setup()/loop()).
build_src_filter =
  +<*>
  -<test_RTOS/main_rtos_sensors.cpp>
  -<test_RTOS/rtos_scheduler_test.cpp>
  -<test_sensors/bno_servo_standalone.cpp>
  -<test_sensors/bno085_standalone.cpp>
  -<test_sensors/ir_test.cpp>
  -<test_RTOS/rtos_ir_test.cpp>
  -<test_sensors/i2c_scanner.cpp>
  -<test_RTOS/rtos_bno_only.cpp>
  -<test_RTOS/rtos_bno085_only.cpp>
  -<test_sensors/blink_test.cpp>
  -<test_RTOS/rtos_statemachine_test.cpp>
  -<test_sensors/servo_test.cpp>
  -<test_sensors/tca_scanner.cpp>
  -<test_sensors/i2c_combined_scanner.cpp>
  -<test_sensors/motor_test.cpp>
  -<test_sensors/motor_test_m1_m3.cpp>
  -<test_sensors/sensors_motors_test.cpp>
  -<test_sensors/testDrive.cpp>
  -<test_sensors/testMotors.cpp>
  -<test_sensors/motor_direct_pins_test.cpp>
  -<test_sensors/testKinematics.cpp>
  -<test_sensors/qtr_test.cpp>
  -<test_sensors/vlx_qtr_test.cpp>
  -<test_sensors/vlx_single_test.cpp>
  -<test_sensors/vlx_drive_test.cpp>
  -<test_sensors/byMotor/>
  -<test_sensors/allMotorsGetRevolution.cpp>
  ; AntiqueStateMachine is kept in the repo as a reference (see
  ; robot/StateMachine/StateMachine.{hpp,cpp}, the header-based version
  ; that replaces it) but must not be compiled: both define the same
  ; LARCStateMachine class / STATES enum in the global namespace, and the
  ; linker fails with duplicate symbols if both end up in the same binary.
  -<robot/StateMachine/AntiqueStateMachine/StateMachine.cpp>

build_flags =
  -I include
  -I lib/Sensors/qtr
  -I lib/Sensors/mux
  -I lib/Sensors/IR_mux
  -I lib/Sensors/tof
  -I lib/Sensors/IR
  -I lib/Sensors/BNO

platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = time

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit BNO055           ; ← BNO055
  adafruit/Adafruit BNO08x           ; ← BNO085
  adafruit/Adafruit TCS34725
  pololu/VL53L0X
  pololu/VL53L1X
  adafruit/Adafruit Unified Sensor
  br3ttb/PID@^1.2.1
  ;PCA for the servos
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  ;VL53L0X
  adafruit/Adafruit PWM Servo Driver Library
  adafruit/Adafruit VL53L1X@^3.1.2

; -----------------------------------------------------------------
; Separate environment to test real RTOS (FreeRTOS) + sensors before
; integrating with LARCStateMachine. Shares src/ with the real firmware
; but build_src_filter limits the build to a single entry point
; (src/main_rtos_sensors.cpp) so it doesn't clash with main.cpp.
;
; pio run -e rtos_sensor_test -t upload
; -----------------------------------------------------------------
[env:rtos_sensor_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/main_rtos_sensors.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; FreeRTOS-Teensy4 vendored in lib/FreeRTOS-Teensy4 (not using the
  ; registry version): the original port miscalculates the SysTick
  ; reload for the current Teensyduino core and hangs vTaskStartScheduler().
  ; See the fix in lib/FreeRTOS-Teensy4/src/port.c (vPortSetupTimerInterrupt).

; -----------------------------------------------------------------
; Minimal test to isolate whether vTaskStartScheduler() works on this
; hardware without touching I2C/sensors (see src/rtos_scheduler_test.cpp).
;
; pio run -e rtos_scheduler_test -t upload -t monitor
; -----------------------------------------------------------------
[env:rtos_scheduler_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/rtos_scheduler_test.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; See note in env:rtos_sensor_test: uses the vendored FreeRTOS-Teensy4
  ; in lib/FreeRTOS-Teensy4 (with the SysTick fix), not the registry one.

; -----------------------------------------------------------------
; Standalone test (NO RTOS) of BNO055 + servo via PCA9685, identical to
; the sketch the team confirmed was working before. Serves as an A/B
; control against env:rtos_sensor_test: same wiring, same I2C, no FreeRTOS.
;
; pio run -e bno_servo_standalone -t upload -t monitor
; -----------------------------------------------------------------
[env:bno_servo_standalone]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/bno_servo_standalone.cpp>

; -----------------------------------------------------------------
; Diagnostic for the 4 digital IRs (FL/FR/BL/BR, see pins.h) read
; directly via digitalRead(), without going through any mux or the rest
; of the firmware. Useful to check they're connected: pass a hand over
; each one and see if its value changes steadily or "flickers" on its
; own (floating pin).
;
; pio run -e ir_test -t upload -t monitor
; -----------------------------------------------------------------
[env:ir_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/ir_test.cpp>

; -----------------------------------------------------------------
; Combines the RTOS (already fixed, see lib/FreeRTOS-Teensy4) with
; reading the 4 digital IRs (see ir_test.cpp) in a single task. The IRs
; are plain digitalRead(), no I2C/mutex/mux, so there's no risk of
; hanging the scheduler like what happened with the BNO055.
;
; pio run -e rtos_ir_test -t upload -t monitor
; -----------------------------------------------------------------
[env:rtos_ir_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/rtos_ir_test.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; See note in env:rtos_sensor_test: uses the vendored FreeRTOS-Teensy4
  ; in lib/FreeRTOS-Teensy4 (with the MSP fix), not the registry one.

; -----------------------------------------------------------------
; Raw I2C bus scan (no RTOS, no assumptions about any device): sweeps
; all 127 addresses and reports which ones respond. Run this first to
; confirm live whether the BNO055 (0x28/0x29) or the TCA9548A
; (0x70-0x77) are actually alive on the current wiring, before assuming
; a specific driver is broken (see src/i2c_scanner.cpp).
;
; pio run -e i2c_scanner -t upload -t monitor
; -----------------------------------------------------------------
[env:i2c_scanner]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/i2c_scanner.cpp>

; -----------------------------------------------------------------
; RTOS (already fixed, see lib/FreeRTOS-Teensy4) reading ONLY the
; BNO055 -- no ToF, no TCA9548A mux, no IR -- to isolate whether the
; sensor responds while running inside the scheduler, once its address
; has been confirmed with env:i2c_scanner (see src/rtos_bno_only.cpp).
;
; pio run -e rtos_bno_only -t upload -t monitor
; -----------------------------------------------------------------
[env:rtos_bno_only]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/rtos_bno_only.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; See note in env:rtos_sensor_test: uses the vendored FreeRTOS-Teensy4
  ; in lib/FreeRTOS-Teensy4 (with the MSP fix), not the registry one.

; -----------------------------------------------------------------
; RTOS (already fixed, see lib/FreeRTOS-Teensy4) reading ONLY the
; BNO085 -- no ToF, no TCA9548A mux, no IR -- analogous to
; env:rtos_bno_only but with Adafruit_BNO08x (SH-2 protocol) instead of
; the BNO055's raw register driver (see src/rtos_bno085_only.cpp).
;
; pio run -e rtos_bno085_only -t upload -t monitor
; -----------------------------------------------------------------
[env:rtos_bno085_only]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_RTOS/rtos_bno085_only.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; See note in env:rtos_sensor_test: uses the vendored FreeRTOS-Teensy4
  ; in lib/FreeRTOS-Teensy4 (with the MSP fix), not the registry one.

; -----------------------------------------------------------------
; Minimal test with no I2C/Serial/sensors: just blinks the built-in LED
; (pin 13). Useful for ruling out power, USB upload, or serial port
; enumeration issues before suspecting the I2C bus.
;
; pio run -e blink_test -t upload
; -----------------------------------------------------------------
[env:blink_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/blink_test.cpp>

; -----------------------------------------------------------------
; Sweeps in a loop (0-180-0) the only servo that, per the team, is
; currently connected: directly to Teensy pin 8 (Servo library, no
; PCA9685). NOTE: in include/pins.h pin 8 is assigned to kPwmPin[0]
; (PWM_M1, chassis motor) -- confirm with the team whether this is
; temporary wiring for this test or the real mapping changed
; (see src/servo_test.cpp).
;
; pio run -e servo_test -t upload -t monitor
; -----------------------------------------------------------------
[env:servo_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/servo_test.cpp>

; -----------------------------------------------------------------
; Channel-by-channel scan of the TCA9548A (confirmed alive at 0x70 by
; env:i2c_scanner): selects each of the 8 channels and scans the I2C
; bus behind it, to confirm which ToFs are actually connected on the
; FR/FL/BL/BR channels (see pins.h and src/tca_scanner.cpp).
;
; pio run -e tca_scanner -t upload -t monitor
; -----------------------------------------------------------------
[env:tca_scanner]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/tca_scanner.cpp>

; -----------------------------------------------------------------
; Combined, continuous version: on each round it pings the BNO055
; directly (main bus) AND scans the TCA9548A's 8 channels looking for
; the ToFs, all in the same loop -- to see the status of both at the
; same time. Includes I2C bus recovery (SCL bit-bang) if the mux stops
; responding mid-round (see src/i2c_combined_scanner.cpp).
;
; pio run -e i2c_combined_scanner -t upload -t monitor
; -----------------------------------------------------------------
[env:i2c_combined_scanner]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/i2c_combined_scanner.cpp>

; pio run -e rtos_statemachine_test -t upload -t monitor
[env:rtos_statemachine_test]
extends = env:teensy41
build_src_filter =
  +<*>
  -<main.cpp>
  -<test_RTOS/main_rtos_sensors.cpp>
  -<test_RTOS/rtos_scheduler_test.cpp>
  -<test_sensors/bno_servo_standalone.cpp>
  -<test_sensors/bno085_standalone.cpp>
  -<test_sensors/ir_test.cpp>
  -<test_RTOS/rtos_ir_test.cpp>
  -<test_sensors/i2c_scanner.cpp>
  -<test_RTOS/rtos_bno_only.cpp>
  -<test_RTOS/rtos_bno085_only.cpp>
  -<test_sensors/blink_test.cpp>
  -<test_sensors/servo_test.cpp>
  -<test_sensors/tca_scanner.cpp>
  -<test_sensors/i2c_combined_scanner.cpp>
  -<test_sensors/motor_test.cpp>
  -<test_sensors/motor_test_m1_m3.cpp>
  -<test_sensors/sensors_motors_test.cpp>
  -<test_sensors/testDrive.cpp>
  -<test_sensors/testMotors.cpp>
  -<test_sensors/motor_direct_pins_test.cpp>
  -<test_sensors/testKinematics.cpp>
  -<test_sensors/qtr_test.cpp>
  -<test_sensors/vlx_qtr_test.cpp>
  -<test_sensors/vlx_single_test.cpp>
  -<test_sensors/vlx_drive_test.cpp>
  -<test_sensors/byMotor/>
  -<test_sensors/allMotorsGetRevolution.cpp>
  ; See note in env:teensy41: AntiqueStateMachine is kept as a reference
  ; but must not be compiled alongside robot/StateMachine/StateMachine.cpp.
  -<robot/StateMachine/AntiqueStateMachine/StateMachine.cpp>
lib_deps =
  ${env:teensy41.lib_deps}
  ; See note in env:rtos_sensor_test: uses the vendored FreeRTOS-Teensy4
  ; in lib/FreeRTOS-Teensy4 (with the MSP fix), not the registry one.

; -----------------------------------------------------------------
; Diagnostico puro del BNO085, sin RTOS: analogo a bno_servo_standalone
; pero para el BNO085 (Adafruit_BNO08x, protocolo SH-2) en vez del
; BNO055. Aisla si el problema es del scheduler/mutex o del sensor/
; handshake SH-2 en si (ver src/test_sensors/bno085_standalone.cpp).
;
; pio run -e bno085_standalone -t upload -t monitor
; -----------------------------------------------------------------
[env:bno085_standalone]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/bno085_standalone.cpp>

; -----------------------------------------------------------------
; Diagnostico standalone de los 4 motores DC del chasis (M1-M4): mismo
; cableado/inversion que subsystem/Drive/Drive.cpp pero sin BNO/PID/EKF.
; Mueve cada motor uno por uno (adelante/atras, reportando delta de
; encoder) y despues los 4 al mismo tiempo. M5 (elevador) queda fuera a
; proposito -- no tiene encoder de cuadratura propio y no se mueve aqui
; (see src/test_sensors/motor_test.cpp).
;
; pio run -e motor_test -t upload -t monitor
; -----------------------------------------------------------------
[env:motor_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/motor_test.cpp>

; -----------------------------------------------------------------
; Diagnostico standalone de M1 (upper-left) y M3 (lower-left) movidos
; AL MISMO TIEMPO -- mismo cableado/inversion que Drive.cpp pero sin
; BNO/PID/EKF. Reporta el delta de encoder de cada uno por separado
; para confirmar que ambos cuentan parejo cuando corren juntos (see
; src/test_sensors/motor_test_m1_m3.cpp).
;
; pio run -e motor_test_m1_m3 -t upload -t monitor
; -----------------------------------------------------------------
[env:motor_test_m1_m3]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/motor_test_m1_m3.cpp>

; -----------------------------------------------------------------
; Combinado: ToF (VLX), IR y QTR frontal se leen e imprimen sin parar
; mientras el chasis (M1-M4) se mueve en ciclo (adelante/atras/izq/der),
; sin BNO/PID/EKF/state machine -- para confirmar de un vistazo que
; sensores y motores funcionan juntos (see src/test_sensors/sensors_motors_test.cpp).
;
; pio run -e sensors_motors_test -t upload -t monitor
; -----------------------------------------------------------------
[env:sensors_motors_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/sensors_motors_test.cpp>

; -----------------------------------------------------------------
; Drives a square (adelante/derecha/atras/izquierda, 1.5s cada uno, con
; pausas) a traves de la clase Drive completa (BNO085 yaw-hold PID +
; cinematica omni + EKF de odometria), para confirmar que todo el stack de
; drive funciona junto, no solo los motores crudos (see
; src/test_sensors/testDrive.cpp). Antes vivia en test/ (pio test, nunca se
; compilaba con pio run) -- movido aqui para poder subirlo como firmware normal.
;
; pio run -e test_drive -t upload -t monitor
; -----------------------------------------------------------------
[env:test_drive]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/testDrive.cpp>
  +<subsystem/Drive/Drive.cpp>

; -----------------------------------------------------------------
; Variante de test_drive: solo adelante (sin cuadrado), yaw-hold PID activo,
; para aislar la correccion angular en linea recta (see
; src/test_sensors/testDriveFORWARD.cpp).
;
; pio run -e test_drive_forward -t upload -t monitor
; -----------------------------------------------------------------
[env:test_drive_forward]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/testDriveFORWARD.cpp>
  +<subsystem/Drive/Drive.cpp>

; -----------------------------------------------------------------
; Mueve cada motor del chasis (M1-M4) adelante y atras uno por uno via
; DCMotor::testForwardBackward() -- sin BNO/PID/EKF/state machine. Antes
; vivia en test/ (pio test, nunca se compilaba con pio run) -- movido aqui
; para poder subirlo como firmware normal (see src/test_sensors/testMotors.cpp).
;
; pio run -e test_motors -t upload -t monitor
; -----------------------------------------------------------------
[env:test_motors]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/testMotors.cpp>

; -----------------------------------------------------------------
; Mueve cada motor del chasis (M1-M4) adelante y atras uno por uno con
; pinMode/digitalWrite/analogWrite DIRECTO sobre IN1/IN2/PWM (Pins::
; kUpperMotors/kLowerMotors/kPwmPin) -- sin la clase DCMotor, sin
; encoder, sin flag invert. Util para confirmar cableado/sentido en
; crudo, sin que la logica de DCMotor enmascare el resultado (see
; src/test_sensors/motor_direct_pins_test.cpp).
;
; pio run -e motor_direct_pins_test -t upload -t monitor
; -----------------------------------------------------------------
[env:motor_direct_pins_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/motor_direct_pins_test.cpp>

; -----------------------------------------------------------------
; Prueba la cinematica omni pura (OmniMotors::MoveXYW, mezcla M1-M4) via
; Drive::testKinematics(): adelante/atras/derecha/izquierda/diagonales,
; con yaw-hold apagado -- sin PID de yaw ni EKF de odometria en el loop.
; Util para confirmar mapeo de pines/inversion y signos de vx/vy/omega
; (see src/test_sensors/testKinematics.cpp).
;
; pio run -e test_kinematics -t upload -t monitor
; -----------------------------------------------------------------
[env:test_kinematics]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/testKinematics.cpp>
  +<subsystem/Drive/Drive.cpp>

; -----------------------------------------------------------------
; Diagnostico standalone (sin RTOS) del QTRX-MD-08A (8 canales analogicos)
; a traves del mux 74HC4067: lee los 8 canales directo con Mux74HC4067::read()
; e imprime raw + min/max en vivo -- no usa la clase QTR (lib/sensors/qtr),
; que esta hardcodeada a N=7 sensores (see src/test_sensors/qtr_test.cpp).
;
; pio run -e qtr_test -t upload -t monitor
; -----------------------------------------------------------------
[env:qtr_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/qtr_test.cpp>

; -----------------------------------------------------------------
; Calibracion PID de RPM por motor individual (src/test_sensors/byMotor/,
; antes vivian en test/testEncoders/byMotor -- movidos aqui por la misma
; razon que testDrive.cpp/testMotors.cpp, ver nota en env:test_drive):
; cada uno maneja su propio motor + encoder directo (sin DCMotor, sin
; Drive), midiendo RPM real via ISR de cuadratura y ajustando PWM con un
; PID propio para alcanzar el setpoint fijo del archivo.
;
; pio run -e ul_encoder_calib -t upload -t monitor
; pio run -e ur_encoder_calib -t upload -t monitor
; pio run -e ll_encoder_calib -t upload -t monitor
; pio run -e lr_encoder_calib -t upload -t monitor
; -----------------------------------------------------------------
[env:ul_encoder_calib]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/byMotor/ULEncoderCalibration.cpp>

[env:ur_encoder_calib]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/byMotor/UREncoderCalibration.cpp>

[env:ll_encoder_calib]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/byMotor/LLEncoderCalibration.cpp>

[env:lr_encoder_calib]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/byMotor/LREncoderCalibration.cpp>

; -----------------------------------------------------------------
; Conteo crudo de ticks de encoder de los 4 motores (M1-M4), SIN mover
; ningun motor por PWM -- solo cuenta flancos RISING del canal A por
; interrupcion. Pensado para girar cada llanta a mano y ver cuantos
; ticks da por vuelta (util para confirmar PPR o para aislar si el
; encoder de un motor especifico responde, sin meter el driver/PWM en
; la ecuacion). Envia 'r' por el monitor serial para resetear los 4
; contadores a la vez (see src/test_sensors/allMotorsGetRevolution.cpp).
;
; pio run -e all_motors_get_revolution -t upload -t monitor
; -----------------------------------------------------------------
[env:all_motors_get_revolution]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/allMotorsGetRevolution.cpp>

; -----------------------------------------------------------------
; Diagnostico standalone (sin motores/BNO/IR) de los 4 ToF (VLX, via
; TCA9548A) y del QTR conectado al segundo mux 74HC4067 (Pins::kMuxSig2 /
; SIG_A1, pin 22 -- confirmado en el esquematico compartido). Solo el
; canal 3 (BR) tiene un VLX confirmado; los otros 3 son placeholders. El
; QTR se lee en los 16 canales del mux2 porque todavia no se sabe en cual
; esta conectado fisicamente (see src/test_sensors/vlx_qtr_test.cpp).
;
; pio run -e vlx_qtr_test -t upload -t monitor
; -----------------------------------------------------------------
[env:vlx_qtr_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/vlx_qtr_test.cpp>

; -----------------------------------------------------------------
; Diagnostico standalone (sin motores/BNO/IR/RTOS) de dos ToF (VLX,
; VL53L1X), en el bus I2C1 (Wire1, SDA1=17/SCL1=16), canales 3 y 4 del
; TCA9548A -- para aislar esos VLX especificos sin depender de los otros
; ni del bus principal (see src/test_sensors/vlx_single_test.cpp).
;
; pio run -e vlx_single_test -t upload -t monitor
; -----------------------------------------------------------------
[env:vlx_single_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/vlx_single_test.cpp>

; -----------------------------------------------------------------
; Combina los dos ToF de vlx_single_test.cpp con la clase Drive completa
; (testDrive.cpp): mientras ambos VLX detecten algo mas cerca que el umbral,
; el robot se desplaza a la derecha; en cuanto uno deja de detectar, se
; detiene.
;
; pio run -e vlx_drive_test -t upload -t monitor
; -----------------------------------------------------------------
[env:vlx_drive_test]
extends = env:teensy41
build_src_filter =
  -<*>
  +<test_sensors/vlx_drive_test.cpp>
  +<subsystem/Drive/Drive.cpp>